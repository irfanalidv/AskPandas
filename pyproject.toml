[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "askpandas"
version = "0.2.0"
description = "Ask questions about pandas DataFrames and CSV files in plain English: an LLM writes pandas code and AskPandas runs it in a restricted sandbox (Ollama, OpenAI, Mistral, Hugging Face or any OpenAI-compatible API)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md Irfan Ali", email = "irfanali29@hotmail.com" }]
keywords = [
    "pandas",
    "data-analysis",
    "natural-language",
    "text-to-pandas",
    "llm",
    "ai",
    "csv",
    "data-science",
    "ollama",
    "openai",
    "mistral",
    "huggingface",
    "data-quality",
    "visualization",
    "analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "psutil>=5.8.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
full = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "plotly>=5.0.0",
]
# Used only by the demo scripts to generate sample data
demo = ["faker>=18.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "types-requests",
    "pre-commit>=3.5",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/irfanalidv/AskPandas"
Documentation = "https://github.com/irfanalidv/AskPandas#readme"
Repository = "https://github.com/irfanalidv/AskPandas"
Issues = "https://github.com/irfanalidv/AskPandas/issues"
Changelog = "https://github.com/irfanalidv/AskPandas/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["askpandas*"]

[tool.setuptools.package-data]
askpandas = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "RET", "PIE"]
ignore = [
    "E501",    # long lines are handled by the formatter; prompt strings are allowed to be long
    "RUF001",  # ambiguous unicode in user-facing strings is intentional
]

[tool.ruff.lint.per-file-ignores]
# Tests and examples favour readability over strict rules
"tests/*" = ["E402", "PTH"]
"examples/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["askpandas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
